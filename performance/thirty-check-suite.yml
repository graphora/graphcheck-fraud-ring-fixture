    metric: node_count
    target: {}
    baseline: performance
    tolerance: { max_delta: 0 }
  - id: node-count-01
    metric: node_count
    target: {}
    baseline: performance
    tolerance: { max_delta: 0 }
  - id: node-count-02
    metric: node_count
    target: {}
    baseline: performance
    tolerance: { max_delta: 0 }
  - id: node-count-03
    metric: node_count
    target: {}
    baseline: performance
