conformance:
  - id: hub-outlier-00
    check: hub_outlier
    with: { label: Account, sample_size: 1000 }
  - id: hub-outlier-01
    check: hub_outlier
    with: { label: Account, sample_size: 1000 }
  - id: hub-outlier-02
    check: hub_outlier
    with: { label: Account, sample_size: 1000 }
  - id: pii-name-00
    check: pii_name_match
    with: { sample_size: 1000 }
  - id: pii-name-01
    check: pii_name_match
