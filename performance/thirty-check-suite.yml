# The 30-check performance suite, extracted from graphcheck's
# tests/performance/test_engine_budget.py so it can be run as a
# standalone check suite, not only from inside that test.
#
# The original test picks its target label dynamically at runtime
# (whichever label has the most nodes). This static file hardcodes
# "Account", since that is the busiest label in this generator's
# output at any scale (roughly 50% of all nodes). If you point this
# at a differently-shaped graph, update the label below.
#
# The drift checks require a "performance" baseline to already exist
# for your target database (run `graphcheck baseline set --name
# performance` after connecting, once your graph is loaded) --
# this file cannot pre-compute your graph's actual counts.

suite: thirty-check-performance-suite
defaults:
  severity: error

competency:
  - id: count-store-00
    question: "Can count-store query 00 answer?"
    query: MATCH (n) RETURN count(n) AS total
    expect:
      rows: { exactly: 1 }
      columns: [total]
      unique: true
  - id: count-store-01
    question: "Can count-store query 01 answer?"
    query: MATCH (n) RETURN count(n) AS total
    expect:
      rows: { exactly: 1 }
      columns: [total]
      unique: true
  - id: count-store-02
    question: "Can count-store query 02 answer?"
    query: MATCH (n) RETURN count(n) AS total
    expect:
      rows: { exactly: 1 }
      columns: [total]
      unique: true
  - id: count-store-03
    question: "Can count-store query 03 answer?"
    query: MATCH (n) RETURN count(n) AS total
    expect:
      rows: { exactly: 1 }
      columns: [total]
      unique: true
  - id: count-store-04
    question: "Can count-store query 04 answer?"
    query: MATCH (n) RETURN count(n) AS total
    expect:
      rows: { exactly: 1 }
      columns: [total]
      unique: true
  - id: count-store-05
    question: "Can count-store query 05 answer?"
    query: MATCH (n) RETURN count(n) AS total
    expect:
      rows: { exactly: 1 }
      columns: [total]
      unique: true
  - id: property-scan-00
    question: "Can full property scan 00 answer?"
    query: MATCH (n) RETURN sum(size(keys(n))) AS property_slots
    expect:
      rows: { exactly: 1 }
      columns: [property_slots]
      unique: true
  - id: property-scan-01
    question: "Can full property scan 01 answer?"
    query: MATCH (n) RETURN sum(size(keys(n))) AS property_slots
    expect:
      rows: { exactly: 1 }
      columns: [property_slots]
      unique: true
  - id: property-scan-02
    question: "Can full property scan 02 answer?"
    query: MATCH (n) RETURN sum(size(keys(n))) AS property_slots
    expect:
      rows: { exactly: 1 }
      columns: [property_slots]
      unique: true
  - id: property-scan-03
    question: "Can full property scan 03 answer?"
    query: MATCH (n) RETURN sum(size(keys(n))) AS property_slots
    expect:
      rows: { exactly: 1 }
      columns: [property_slots]
      unique: true

