# Example CQ (Competency Question) library for the fraud-ring fixture.
#
# 8 shape-pattern CQs (work zero-config on any graph matching the fraud-ring
# schema -- no hardcoded expected values) plus 2 regression overlays (pinned
# known-good values, since these are deliberately planted in seed.cypher and
# will not change unless the seed itself changes).
#
# Each entry states what it catches in a comment above it. Run these against
# a live fraud-ring fixture graph (see fixtures/fraud-ring/README.md), or
# via tests/test_example_cqs.py, which actually executes every one of them.

competency:

  # ==========================================================================
  # Jayachandra's half: core OWNS/CONTROLS/SENT/RECEIVED_BY patterns
  # ==========================================================================

  # Catches: the CONTROLS chain breaking entirely (zero rows), path
  # explosion if CONTROLS ever became cyclic, or the account_id column
  # disappearing due to a schema rename.
  - id: cq-001
    question: "Which accounts does a customer control, directly or via intermediaries?"
    provenance: "KYC requirement -- canonical shape pattern"
    query: |
      MATCH (c:Customer {id: $customer_id})-[:CONTROLS*1..4]->(a:Account)
      RETURN a.id AS account_id
    params: { customer_id: "CUST-5" }
    expect:
      rows: { min: 1, max: 200 }
      columns: [account_id]
      unique: true
    severity: error

  # Catches: the OWNS relationship disappearing, or a customer somehow
  # owning zero accounts when the fixture guarantees every base customer
  # owns at least one.
  - id: cq-002
    question: "Which accounts does a customer directly own?"
    provenance: "canonical shape pattern"
    query: |
      MATCH (c:Customer {id: $customer_id})-[:OWNS]->(a:Account)
      RETURN a.id AS account_id
    params: { customer_id: "CUST-1" }
    expect:
      rows: { min: 1, max: 10 }
      columns: [account_id]
      unique: true
    severity: error

  # Catches: the SENT relationship disappearing, or an account that
  # should have sent transactions showing zero.
  - id: cq-003
    question: "Which transactions has an account sent?"
    provenance: "canonical shape pattern"
    query: |
      MATCH (a:Account {id: $account_id})-[:SENT]->(t:Transaction)
      RETURN t.id AS transaction_id
    params: { account_id: "ACC-1" }
    expect:
      rows: { min: 0, max: 50 }
      columns: [transaction_id]
      unique: true
    severity: warn

  # Catches: the RECEIVED_BY relationship disappearing, or a transaction
  # with more than one receiving account (a real data integrity bug --
  # RECEIVED_BY is a strict exactly-one-receiver relationship per
  # schema.md, unlike OWNS which only guarantees at most one).
  - id: cq-004
    question: "Which account received a given transaction?"
    provenance: "canonical shape pattern"
    query: |
      MATCH (t:Transaction {id: $transaction_id})-[:RECEIVED_BY]->(a:Account)
      RETURN a.id AS account_id
    params: { transaction_id: "TXN-1" }
    expect:
      rows: { min: 1, max: 1 }
      columns: [account_id]
      unique: true
    severity: error

  # Regression overlay: pinned known-good value. CUST-1 is guaranteed by
  # seed.cypher's deterministic OWNS mapping (customer index = ((i-1) %
  # 1500) + 1) to own exactly ACC-1. This will only ever change if the
  # seed's OWNS mapping logic changes.
  - id: cq-002-regression
    question: "CUST-1 owns exactly ACC-1"
    provenance: "regression -- pinned to seed.cypher's deterministic OWNS mapping"
    query: |
      MATCH (c:Customer {id: $customer_id})-[:OWNS]->(a:Account)
      RETURN a.id AS account_id
    params: { customer_id: "CUST-1" }
    expect:
      contains: ["ACC-1"]
    severity: error

  # ==========================================================================
  # Janani's half: PII coverage, hub-outlier, and fraud-ring patterns
  # ==========================================================================

  # Catches: the PII fields (email, national_id) disappearing from
  # base-population Customers.
  - id: cq-005
    question: "Which customers have PII fields populated?"
    provenance: "PII coverage shape pattern"
    query: |
      MATCH (c:Customer)
      WHERE c.email IS NOT NULL
         OR c.national_id IS NOT NULL
      RETURN
          c.id AS customer,
          true AS contains_pii
      ORDER BY customer
    params: {}
    expect:
      rows: { min: 1, max: 2000 }
      columns: [customer, contains_pii]
      unique: true
    severity: warn

  # Catches: hub-outlier customers (controlling an unusually large
  # number of accounts) disappearing or ballooning unexpectedly.
  - id: cq-006
    question: "Which customers control more than 2 accounts?"
    provenance: "hub-outlier shape pattern"
    query: |
      MATCH (c:Customer)-[:CONTROLS]->(a:Account)
      WITH c, count(a) AS controlled_accounts
      WHERE controlled_accounts > 2
      RETURN
          c.id AS customer_id,
          controlled_accounts
      ORDER BY controlled_accounts DESC
    params: {}
    expect:
      rows: { min: 1, max: 20 }
      columns: [customer_id, controlled_accounts]
      unique: true
    severity: warn

  # Catches: dense fraud-ring cluster patterns disappearing. LIMIT 50
  # caps the result size to guard against path explosion in dense
  # clusters (see cq-001's fix for the same underlying risk).
  - id: cq-007
    question: "Which customer/account/account triples form a 2-hop control chain?"
    provenance: "fraud-typology shape pattern"
    query: |
      MATCH (c:Customer)-[:CONTROLS]->(a1:Account)-[:CONTROLS]->(a2:Account)
      RETURN DISTINCT
          c.id AS customer_id,
          a1.id AS first_account,
          a2.id AS second_account
      ORDER BY customer_id
      LIMIT 50
    params: {}
    expect:
      rows: { min: 1, max: 50 }
      columns: [customer_id, first_account, second_account]
    severity: warn

  # Catches: direct Account-to-Account control edges (e.g. shell
  # accounts controlling other accounts, or dense ring-cluster
  # accounts controlling each other) disappearing from the graph.
  - id: cq-008
    question: "Which accounts directly control which other accounts?"
    provenance: "fraud-typology shape pattern"
    query: |
      MATCH (a1:Account)-[:CONTROLS]->(a2:Account)
      RETURN
          a1.id AS controller_account,
          a2.id AS controlled_account
      ORDER BY controller_account
      LIMIT 50
    params: {}
    expect:
      rows: { min: 1, max: 50 }
      columns: [controller_account, controlled_account]
    severity: warn

  # Regression overlay: pinned known-good fact. ACC-CARD-0001 is
  # deliberately owned by both CUST-CARD-0001 and CUST-CARD-0002 (the
  # planted cardinality violation) -- so CUST-CARD-0001 owning it is
  # guaranteed true by seed.cypher and will only change if that defect
  # is redesigned.
  - id: cq-009-regression
    question: "CUST-CARD-0001 owns ACC-CARD-0001"
    provenance: "regression -- pinned to seed.cypher's planted cardinality violation"
    query: |
      MATCH (c:Customer {id: 'CUST-CARD-0001'})-[:OWNS]->(a:Account {id: 'ACC-CARD-0001'})
      RETURN count(*) = 1 AS relationship_exists
    params: {}
    expect:
      rows: { min: 1, max: 1 }
      columns: [relationship_exists]
      contains: [true]
    severity: error