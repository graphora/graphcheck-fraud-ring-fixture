# Example CQ library for the fraud-ring fixture.
# 8 shape-pattern CQs (cq-001 to cq-008) + 2 regression overlays (cq-009,
# cq-010). See tests/test_example_cqs.py to run these live against a
# fixture graph.

competency:

  # Catches broken or exploding CONTROLS chains.
  - id: cq-001
    question: "Which accounts does a customer control, directly or via intermediaries?"
    provenance: "KYC requirement -- canonical shape pattern"
    query: |
      MATCH (c:Customer {id: $customer_id})-[:CONTROLS*1..4]->(a:Account)
      RETURN a.id AS account_id
    params: { customer_id: "CUST-5" }
    expect:
      rows: { min: 1, max: 200 }
      columns: [account_id]
      unique: true
    severity: error

  # Catches missing OWNS edges.
  - id: cq-002
    question: "Which accounts does a customer directly own?"
    provenance: "canonical shape pattern"
    query: |
      MATCH (c:Customer {id: $customer_id})-[:OWNS]->(a:Account)
      RETURN a.id AS account_id
    params: { customer_id: "CUST-1" }
    expect:
      rows: { min: 1, max: 10 }
      columns: [account_id]
      unique: true
    severity: error

  # Catches missing SENT edges. Uses ACC-4 (known to send), not ACC-1
  # (zero senders), so a deleted SENT relationship can't slip through.
  - id: cq-003
    question: "Which transactions has an account sent?"
    provenance: "canonical shape pattern"
    query: |
      MATCH (a:Account {id: $account_id})-[:SENT]->(t:Transaction)
      RETURN t.id AS transaction_id
    params: { account_id: "ACC-4" }
    expect:
      rows: { min: 1, max: 50 }
      columns: [transaction_id]
      unique: true
    severity: error

  # Catches missing or duplicate RECEIVED_BY edges.
  - id: cq-004
    question: "Which account received a given transaction?"
    provenance: "canonical shape pattern"
    query: |
      MATCH (t:Transaction {id: $transaction_id})-[:RECEIVED_BY]->(a:Account)
      RETURN a.id AS account_id
    params: { transaction_id: "TXN-1" }
    expect:
      rows: { min: 1, max: 1 }
      columns: [account_id]
      unique: true
    severity: error

  # Catches any of the 3 PII fields missing. Requires all 3 (AND), not
  # just one (OR), so stripping a field from every customer can't slip
  # through unnoticed.
  - id: cq-005
    question: "Which customers have all three PII fields fully populated?"
    provenance: "PII coverage shape pattern"
    query: |
      MATCH (c:Customer)
      WHERE c.tax_id IS NOT NULL
        AND c.email IS NOT NULL
        AND c.national_id IS NOT NULL
      RETURN
          c.id AS customer,
          true AS contains_pii
      ORDER BY customer
    params: {}
    expect:
      rows: { min: 1500, max: 1500 }
      columns: [customer, contains_pii]
      unique: true
    severity: error

  # Catches hub-outlier customers disappearing or ballooning.
  - id: cq-006
    question: "Which customers control more than 2 accounts?"
    provenance: "hub-outlier shape pattern"
    query: |
      MATCH (c:Customer)-[:CONTROLS]->(a:Account)
      WITH c, count(a) AS controlled_accounts
      WHERE controlled_accounts > 2
      RETURN
          c.id AS customer_id,
          controlled_accounts
      ORDER BY controlled_accounts DESC
    params: {}
    expect:
      rows: { min: 1, max: 20 }
      columns: [customer_id, controlled_accounts]
      unique: true
    severity: warn

  # Catches dense fraud-ring clusters disappearing. LIMIT 50 guards
  # against path explosion.
  - id: cq-007
    question: "Which customer/account/account triples form a 2-hop control chain?"
    provenance: "fraud-typology shape pattern"
    query: |
      MATCH (c:Customer)-[:CONTROLS]->(a1:Account)-[:CONTROLS]->(a2:Account)
      RETURN DISTINCT
          c.id AS customer_id,
          a1.id AS first_account,
          a2.id AS second_account
      ORDER BY customer_id
      LIMIT 50
    params: {}
    expect:
      rows: { min: 1, max: 50 }
      columns: [customer_id, first_account, second_account]
    severity: warn

  # Catches direct Account-to-Account control edges disappearing.
  - id: cq-008
    question: "Which accounts directly control which other accounts?"
    provenance: "fraud-typology shape pattern"
    query: |
      MATCH (a1:Account)-[:CONTROLS]->(a2:Account)
      RETURN
          a1.id AS controller_account,
          a2.id AS controlled_account
      ORDER BY controller_account
      LIMIT 50
    params: {}
    expect:
      rows: { min: 1, max: 50 }
      columns: [controller_account, controlled_account]
    severity: warn

  # Regression: Verify that CUST-1 owns ACC-1 in the seeded graph.
  - id: cq-009
    question: "CUST-1 owns ACC-1"
    provenance: "regression -- pinned to seed.cypher's deterministic OWNS mapping"
    query: |
      MATCH (c:Customer {id: $customer_id})-[:OWNS]->(a:Account)
      RETURN a.id AS account_id
    params:
      customer_id: "CUST-1"
    expect:
      contains: ["ACC-1"]
    severity: error

  # Regression: CUST-CARD-0001 always owns ACC-CARD-0001 (planted defect).
  - id: cq-010
    question: "CUST-CARD-0001 owns ACC-CARD-0001"
    provenance: "regression -- pinned to seed.cypher's planted cardinality violation"
    query: |
      MATCH (c:Customer {id: 'CUST-CARD-0001'})-[:OWNS]->(a:Account {id: 'ACC-CARD-0001'})
      RETURN count(*) = 1 AS relationship_exists
    params: {}
    expect:
      rows: { min: 1, max: 1 }
      columns: [relationship_exists]
      contains: [true]
    severity: error